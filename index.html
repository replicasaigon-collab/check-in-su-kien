<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Đăng ký sự kiện</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 30px 15px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

    #ticket {
      display: none;
      margin-top: 30px;
      padding: 25px;
      border: 2px dashed #111;
      border-radius: 12px;
      text-align: center;
      background: white;
    }

    #ticket h2 {
      margin-top: 0;
    }

    #qrcode {
      display: flex;
      justify-content: center;
      margin: 20px 0;
    }

    .ticket-code {
      font-size: 12px;
      color: #777;
      word-break: break-all;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Đăng ký sự kiện</h1>
  <p class="subtitle">
    Đăng ký để nhận vé QR check-in
  </p>

  <form id="registrationForm">

    <label>Sự kiện</label>
    <select id="eventSelect" required>
      <option value="">Đang tải sự kiện...</option>
    </select>

    <label>Họ và tên</label>
    <input
      type="text"
      id="fullName"
      placeholder="Nguyễn Văn A"
      required
    >

    <label>Email</label>
    <input
      type="email"
      id="email"
      placeholder="email@example.com"
      required
    >

    <label>Số điện thoại</label>
    <input
      type="tel"
      id="phone"
      placeholder="0901234567"
    >

    <label>Đơn vị</label>
    <input
      type="text"
      id="organization"
      placeholder="Công ty / Trường học"
    >

    <button id="submitButton" type="submit">
      Đăng ký & nhận vé QR
    </button>

  </form>

  <div id="message"></div>

  <div id="ticket">

    <h2>🎟 VÉ THAM DỰ</h2>

    <h3 id="ticketEvent"></h3>

    <p>
      Họ tên:
      <strong id="ticketName"></strong>
    </p>

    <div id="qrcode"></div>

    <p>Đưa mã QR này cho nhân viên khi check-in.</p>

    <div
      id="ticketCode"
      class="ticket-code">
    </div>

  </div>

</div>


<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- QR Code -->
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<!-- Thông tin Supabase -->
<script src="config.js"></script>


<script>

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


const eventSelect =
  document.getElementById("eventSelect");

const form =
  document.getElementById("registrationForm");

const message =
  document.getElementById("message");

const submitButton =
  document.getElementById("submitButton");


/* ===============================
   TẢI DANH SÁCH SỰ KIỆN
================================ */

async function loadEvents() {

  const { data, error } =
    await db
      .from("events")
      .select("*")
      .eq("is_open", true)
      .order("event_date");


  if (error) {

    console.error(error);

    eventSelect.innerHTML =
      `<option value="">
        Không tải được sự kiện
       </option>`;

    return;
  }


  eventSelect.innerHTML =
    `<option value="">
      -- Chọn sự kiện --
     </option>`;


  data.forEach(event => {

    const option =
      document.createElement("option");

    option.value = event.id;

    option.textContent =
      `${event.name} - ${
        new Date(event.event_date)
        .toLocaleString("vi-VN")
      }`;

    option.dataset.name =
      event.name;

    eventSelect.appendChild(option);

  });

}


/* ===============================
   ĐĂNG KÝ
================================ */

form.addEventListener(
  "submit",

  async function(e) {

    e.preventDefault();

    message.textContent = "";

    submitButton.disabled = true;
    submitButton.textContent =
      "Đang đăng ký...";


    const eventId =
      eventSelect.value;

    const fullName =
      document
        .getElementById("fullName")
        .value
        .trim();

    const email =
      document
        .getElementById("email")
        .value
        .trim();

    const phone =
      document
        .getElementById("phone")
        .value
        .trim();

    const organization =
      document
        .getElementById("organization")
        .value
        .trim();


    if (!eventId) {

      message.textContent =
        "Vui lòng chọn sự kiện.";

      submitButton.disabled = false;

      submitButton.textContent =
        "Đăng ký & nhận vé QR";

      return;
    }


    /* Tạo mã vé trên trình duyệt */

    const ticketCode =
      crypto.randomUUID();


    const { error } =
      await db
        .from("registrations")
        .insert({

          event_id: eventId,

          full_name: fullName,

          email: email,

          phone: phone,

          organization: organization,

          ticket_code: ticketCode

        });


    if (error) {

      console.error(error);

      if (error.code === "23505") {

        message.textContent =
          "Email này đã đăng ký sự kiện.";

      } else {

        message.textContent =
          "Có lỗi xảy ra: " +
          error.message;

      }


      submitButton.disabled = false;

      submitButton.textContent =
        "Đăng ký & nhận vé QR";

      return;

    }


    /* ===============================
       HIỂN THỊ VÉ
    ================================ */

    message.textContent =
      "Đăng ký thành công!";


    const selected =
      eventSelect.options[
        eventSelect.selectedIndex
      ];


    document
      .getElementById("ticketEvent")
      .textContent =
      selected.dataset.name;


    document
      .getElementById("ticketName")
      .textContent =
      fullName;


    document
      .getElementById("ticketCode")
      .textContent =
      ticketCode;


    const qrContainer =
      document.getElementById("qrcode");

    qrContainer.innerHTML = "";


    new QRCode(
      qrContainer,
      {
        text: ticketCode,
        width: 200,
        height: 200
      }
    );


    document
      .getElementById("ticket")
      .style.display =
      "block";


    form.style.display =
      "none";

  }

);


/* Chạy khi mở trang */

loadEvents();

</script>

</body>
</html>
